<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="shell">
    <nav class="topbar">
        <a th:href="@{/account}">Account</a>
        <a th:href="@{/algorithms}">Algorithms</a>
        <a th:href="@{/password}">Change password</a>
        <a th:href="@{/admin/users}">Admin</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Logout</button>
        </form>
    </nav>

    <section class="panel auth-panel">
        <h1>Change password</h1>
        <form th:action="@{/password}" th:object="${passwordForm}" method="post" class="form">
            <label for="currentPassword">Current password</label>
            <input id="currentPassword" th:field="*{currentPassword}" type="password" required>
            <p class="message error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></p>

            <label for="newPassword">New password</label>
            <input id="newPassword" th:field="*{newPassword}" type="password" required minlength="6">
            <p class="message error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>

            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" th:field="*{confirmPassword}" type="password" required minlength="6">
            <p class="message error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>

            <button type="submit">Update password</button>
        </form>
    </section>
</main>
</body>
</html>
